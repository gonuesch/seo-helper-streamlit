# cloudbuild.yaml - NUR ZUM TESTEN mit hartcodierten Platzhaltern

steps:
# Step #0: Erstelle config.toml und secrets.toml mit PLATZHALTERN
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      mkdir -p .streamlit

      # Schreibe die config.toml
      echo '[server]' > .streamlit/config.toml
      echo 'headless = true' >> .streamlit/config.toml
      echo 'enableCORS = false' >> .streamlit/config.toml
      echo '' >> .streamlit/config.toml
      echo '[auth]' >> .streamlit/config.toml
      echo 'require_login = true' >> .streamlit/config.toml
      echo 'login_providers = ["google"]' >> .streamlit/config.toml

      # Schreibe die secrets.toml mit Platzhaltern statt echten Secrets
      echo '[connections.google_oauth]' > .streamlit/secrets.toml
      echo 'client_id = "test-client-id"' >> .streamlit/secrets.toml
      echo 'client_secret = "test-client-secret"' >> .streamlit/secrets.toml
      echo 'redirect_uri = "https://placeholder.com"' >> .streamlit/secrets.toml
      echo 'server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"' >> .streamlit/secrets.toml
      
      echo '' >> .streamlit/secrets.toml
      echo 'gemini_api_key = "test-gemini-key"' >> .streamlit/secrets.toml

# Steps #1, #2, #3 bleiben unverändert...
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/seo-helper-repo/seo-helper-image:$COMMIT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/seo-helper-repo/seo-helper-image:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'seo-helper-streamlit'
    - '--image'
    - 'europe-west1-docker.pkg.dev/$PROJECT_ID/seo-helper-repo/seo-helper-image:$COMMIT_SHA'
    - '--region'
    - 'europe-west1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--session-affinity'

options:
  logging: CLOUD_LOGGING_ONLY