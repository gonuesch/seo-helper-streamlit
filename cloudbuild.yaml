# cloudbuild.yaml - Finaler Versuch mit expliziter Provider-Config 1

steps:
# Step #0: Erstelle config.toml und secrets.toml
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      mkdir -p .streamlit

      # Schreibe die config.toml mit explizitem Login-Provider
      echo '[server]' > .streamlit/config.toml
      echo 'headless = true' >> .streamlit/config.toml
      echo 'enableCORS = false' >> .streamlit/config.toml
      echo 'enableWebsocketCompression = false' >> .streamlit/config.toml
      echo '' >> .streamlit/config.toml
      echo '[auth]' >> .streamlit/config.toml
      echo 'require_login = true' >> .streamlit/config.toml
      # NEU: Wir definieren den Provider hier explizit
      echo 'login_providers = ["google"]' >> .streamlit/config.toml

      # Schreibe die secrets.toml
      echo '[connections.google_oauth]' > .streamlit/secrets.toml
      echo 'client_id = "'$(gcloud secrets versions access latest --secret=auth-client-id)'"' >> .streamlit/secrets.toml
      echo 'client_secret = "'$(gcloud secrets versions access latest --secret=auth-client-secret)'"' >> .streamlit/secrets.toml
      echo 'cookie_secret = "'$(gcloud secrets versions access latest --secret=auth-cookie-secret)'"' >> .streamlit/secrets.toml
      echo 'redirect_uri = "'$(gcloud secrets versions access latest --secret=auth-redirect-uri)'"' >> .streamlit/secrets.toml
      echo 'server_metadata_url = "'$(gcloud secrets versions access latest --secret=auth-server-metadata-url)'"' >> .streamlit/secrets.toml
      
      echo '' >> .streamlit/secrets.toml
      echo 'admin_email = "'$(gcloud secrets versions access latest --secret=admin-email)'"' >> .streamlit/secrets.toml
      echo 'elevenlabs_api_key = "'$(gcloud secrets versions access latest --secret=elevenlabs-api-key)'"' >> .streamlit/secrets.toml
      echo 'gemini_api_key = "'$(gcloud secrets versions access latest --secret=gemini-api-key)'"' >> .streamlit/secrets.toml

# Steps #1, #2, #3 bleiben unverändert...
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/seo-helper-repo/seo-helper-image:$COMMIT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/seo-helper-repo/seo-helper-image:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'seo-helper-streamlit'
    - '--image'
    - 'europe-west1-docker.pkg.dev/$PROJECT_ID/seo-helper-repo/seo-helper-image:$COMMIT_SHA'
    - '--region'
    - 'europe-west1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--session-affinity'

options:
  logging: CLOUD_LOGGING_ONLY