# Cloud Build configuration for Translation Service
# This file automates the build and deployment process for Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/translation-service:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/translation-service:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/translation-service:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/translation-service:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'translation-service',
      '--image', 'gcr.io/$PROJECT_ID/translation-service:$COMMIT_SHA',
      '--platform', 'managed',
      '--region', 'europe-west1',
      '--allow-unauthenticated',
      '--memory', '4Gi',
      '--cpu', '2',
      '--timeout', '3600',
      '--max-instances', '1',
      '--min-instances', '0',
      '--concurrency', '1',
      '--no-cpu-throttling',
      '--set-env-vars', 'GCP_PROJECT=$PROJECT_ID'
    ]

# Build configuration
options:
  machineType: 'E2_HIGHCPU_8'  # Use high-CPU machine for faster builds
  diskSizeGb: 100  # Increase disk size for large dependencies
  logging: CLOUD_LOGGING_ONLY  # Fix logging configuration

# Substitution variables
substitutions:
  _SERVICE_NAME: 'translation-service'
  _REGION: 'europe-west1'
  _MEMORY: '4Gi'
  _CPU: '2'
  _TIMEOUT: '3600'

# Build timeout
timeout: '1200s'  # 20 minutes timeout for build process