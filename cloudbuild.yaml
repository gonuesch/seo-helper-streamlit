# Cloud Build configuration for Translation Service
# This file automates the build and deployment process for Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', '$_DOCKERFILE',
      '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', '$_SERVICE_NAME',
      '--image', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA',
      '--platform', 'managed',
      '--region', '$_REGION',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '$_MEMORY',
      '--cpu', '$_CPU',
      '--timeout', '$_TIMEOUT',
      '--max-instances', '$_MAX_INSTANCES',
      '--min-instances', '$_MIN_INSTANCES',
      '--concurrency', '$_CONCURRENCY',
      '--no-cpu-throttling',
      '--set-env-vars', 'GCP_PROJECT=$PROJECT_ID',
      '--set-secrets', 'GEMINI_API_KEY=gemini-api-key:latest'
    ]

# Build configuration
options:
  machineType: 'E2_HIGHCPU_8'  # Use high-CPU machine for faster builds
  diskSizeGb: 100  # Increase disk size for large dependencies
  logging: CLOUD_LOGGING_ONLY  # Fix logging configuration

# Substitution variables
# These can be overridden in Cloud Build triggers
substitutions:
  _SERVICE_NAME: 'translation-service'
  _DOCKERFILE: 'Dockerfile'
  _REGION: 'europe-west1'
  _MEMORY: '4Gi'
  _CPU: '2'
  _TIMEOUT: '3600'
  _MAX_INSTANCES: '1'
  _MIN_INSTANCES: '0'
  _CONCURRENCY: '1'

# Build timeout
timeout: '1200s'  # 20 minutes timeout for build process