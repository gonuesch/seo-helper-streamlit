# app-flex.yaml - App Engine Flex Environment (unterstützt WebSocket)

runtime: python
env: flex

# Flex Environment unterstützt WebSocket-Verbindungen
service: default

# Ressourcen-Konfiguration
resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

# Automatische Skalierung
automatic_scaling:
  min_num_instances: 1
  max_num_instances: 5
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.7

# Startbefehl
entrypoint: streamlit run seo_app.py --server.port $PORT --server.address=0.0.0.0

# Netzwerk-Konfiguration für WebSocket
network:
  session_affinity: true
  forwarded_ports:
    - 8080

# Umgebungsvariablen
env_variables:
  STREAMLIT_SERVER_PORT: "8080"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0" 